name: Build macOS and Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            output: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle: nsis
            output: src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Offline checks
        run: |
          python -m compileall -q aliyun_auto_pipeline.py local_live_script_tool.py live_script_tool.py
          python -c "import aliyun_auto_pipeline, local_live_script_tool, live_script_tool"
          npm run build
      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: live-script-${{ matrix.os }}
          path: ${{ matrix.output }}
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" ${{ matrix.output }} --clobber
